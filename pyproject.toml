[project]
name = "xueqiu-mcp"
version = "0.1.0"
description = "雪球(xueqiu.com)行情与财务数据的 MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 原生 CallToolResult（图片 + structuredContent）需要新版 SDK。
    "mcp>=1.30,<3",
    "httpx>=0.27.0",
    # HTTP/2 多路复用：stock.xueqiu.com 支持 h2，几条连接就能扛住上百并发，
    # 省下大量 TLS 握手和 socket 内存。纯 Python 包，很轻。
    "h2>=4.0",
    # 临时扫码登录网页（同样也是 MCP HTTP 传输的依赖）。
    "starlette>=0.27",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
# orjson 是编译包，在部分 ARM 小机器上装起来麻烦，所以放可选。
# 装上后大 JSON（如 500 根 K 线）的解析快 2~3 倍。
fast = ["orjson>=3.9"]
# 本地浏览器：扫码登录，以及长文正文的兜底渲染。装完还要执行一次
# `playwright install chromium` 下载浏览器内核（约 150MB）。
# 不装也不影响其余工具，只是长文会退回摘要、登录要手动贴 Cookie。
browser = ["playwright>=1.40"]

[project.scripts]
xueqiu-mcp = "xueqiu_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xueqiu_mcp"]
