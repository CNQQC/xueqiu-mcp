name: 端到端巡检

# 每周一次去真打雪球，用来发现「雪球改版 / 字段变了 / 接口挪了」这类外部变化。
# 与 CI 分开是为了让失败的含义明确：这里红了是雪球那边变了，不是这次改动坏了。
on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 01:00 UTC（北京时间 09:00）
  workflow_dispatch:

jobs:
  e2e:
    name: 实调全部工具
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[fast]"
      - run: python tests/test_mcp_e2e.py
